name: phatriage-gpu
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - hmmer=3.4
  - pytorch=2.13.*
  - pytorch-cuda=13.0
  # Use conda builds for compiled packages on older Linux clusters.
  - numpy=2.2.6
  - pandas=2.3.3
  - pip:
      - pyrodigal-gv==0.3.2
      - transformers==4.57.6
      - safetensors==0.8.0
      - huggingface-hub==0.36.2
