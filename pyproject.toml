[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phatriage"
version = "0.1.0"
description = "Three-class bacteriophage lifestyle prediction with temperate-marker annotation"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {text = "MIT"}
authors = [{name = "Dan Huang"}]
keywords = ["bacteriophage", "phage", "lifestyle", "ProkBERT", "HMMER"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "torch>=2.4",
  "transformers==4.57.6",
  "safetensors>=0.4",
  "huggingface-hub>=0.30",
]

[project.scripts]
phatriage = "phatriage.cli:main"

[project.urls]
Homepage = "https://github.com/danhuangagu-ship-it/PhaTriAGE"
Issues = "https://github.com/danhuangagu-ship-it/PhaTriAGE/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
